<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="Filmmaker and creative director portfolio.">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <!-- Nothing to edit in this file. All text, colours and fonts come from content.js -->
</head>
<body>

  <!-- Loading screen -->
  <div class="intro t-dark" id="intro" aria-hidden="true">
    <div class="intro-name" id="intro-name"></div>
    <div class="intro-meta">
      <span id="intro-role"></span>
      <span class="intro-num" id="intro-num">000</span>
    </div>
    <div class="intro-bar"><i id="intro-bar"></i></div>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="mouse-glow" id="mouse-glow" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="nav t-dark" id="nav">
    <div class="wrap">
      <a href="#home" class="brand" id="brand" aria-label="Back to top"></a>
      <nav aria-label="Main"><ul id="nav-list"></ul></nav>
      <a href="#contact" class="nav-cta" data-magnetic><i class="dot"></i><span id="nav-cta-text"></span></a>
    </div>
  </header>

  <main>
    <!-- ================= HEADER (dark) ================= -->
    <section class="hero t-dark" id="home" data-theme="dark">
      <canvas class="hero-particles" id="particles" aria-hidden="true"></canvas>
      <div class="hero-vignette" aria-hidden="true"></div>
      <div class="hero-bg" id="hero-bg" aria-hidden="true"><img id="hero-bg-img" alt=""></div>

      <div class="wrap hero-grid">
        <div class="hero-meta ani" style="--d:.2s">
          <span class="eyebrow" id="hero-role"></span>
          <span class="eyebrow" id="hero-year"></span>
          <span class="eyebrow hide-sm" id="hero-label"></span>
          <span class="eyebrow avail" id="hero-avail"></span>
        </div>

        <aside class="hero-side hero-left ani" style="--d:.9s">
          <span class="idx">01 — Intro</span>
          <p id="hero-tagline"></p>
        </aside>

        <div class="hero-stage" id="hero-stage">
          <figure class="hero-media" id="hero-media">
            <img id="hero-img" alt="" draggable="false">
          </figure>
          <div class="chips" id="chips"></div>
        </div>

        <aside class="hero-side hero-right ani" style="--d:1s" id="now">
          <span class="idx" id="now-label">02 — Currently</span>
          <p class="now-word"><span id="now-word"></span></p>
          <p class="now-line" id="prompt-text"><span id="typed"></span><span class="caret"></span><span class="ghost" id="ghost"></span></p>
          <div class="now-actions">
            <a href="#contact" class="round-btn" id="talk-btn" data-magnetic>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H13l-4.5 4v-4h-2A2.5 2.5 0 0 1 4 13.5z"/><circle cx="8.5" cy="9.5" r=".6"/><circle cx="12" cy="9.5" r=".6"/><circle cx="15.5" cy="9.5" r=".6"/></svg>
            </a>
            <button class="round-btn" id="play-btn" type="button" data-magnetic>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8.5 6v12l10-6z"/></svg>
            </button>
          </div>
        </aside>

        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-title ani" id="hero-title" style="--d:1.1s"></p>

        <div class="hero-foot ani" style="--d:1.3s">
          <div class="actions">
            <a href="#work" class="btn" data-magnetic>
              <span data-bind="heroButtons.primary"></span>
              <svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
            </a>
            <button class="link-btn" id="showreel-btn" type="button" hidden><span data-bind="heroButtons.showreel"></span></button>
          </div>
          <div class="scroll-cue" aria-hidden="true"><i></i><span>Scroll to explore</span></div>
        </div>
      </div>
    </section>

    <!-- ================= MOVING BAND (white) ================= -->
    <div class="marquee t-white" id="marquee" data-theme="light" aria-hidden="true"></div>

    <!-- ================= WORK (off-white) ================= -->
    <section id="work" class="t-light" data-theme="light">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="sec-idx"></span>
          <h2 data-bind="sections.work.title"></h2>
          <span class="eyebrow sec-sub" data-bind="sections.work.subtitle" data-hide-empty></span>
          <div class="filters" id="filters"></div>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <!-- ================= ABOUT (dark grey) ================= -->
    <section id="about" class="t-grey" data-theme="dark">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="sec-idx"></span>
          <h2 data-bind="sections.about.title"></h2>
          <span class="eyebrow sec-sub" data-bind="sections.about.subtitle" data-hide-empty></span>
        </div>
        <div class="about-grid">
          <div class="about-visual reveal" id="about-visual">
            <div class="about-img" id="about-img"></div>
            <div class="about-badge glass" id="about-badge"></div>
            <div class="about-ctrl">
              <span class="about-count" id="about-count"></span>
              <div class="about-bars" id="about-bars"></div>
            </div>
          </div>
          <div class="about-text">
            <h3 id="about-heading" class="reveal"></h3>
            <div class="about-paras" id="about-paras"></div>
            <div class="stats reveal" id="stats"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SERVICES (white) ================= -->
    <section id="services" class="t-white" data-theme="light">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="sec-idx"></span>
          <h2 data-bind="sections.services.title"></h2>
          <span class="eyebrow sec-sub" data-bind="sections.services.subtitle" data-hide-empty></span>
        </div>
        <div class="services" id="services-list"></div>
      </div>
    </section>

    <!-- ================= CONTACT (near black) ================= -->
    <section id="contact" class="t-dark" data-theme="dark">
      <div class="contact-glow" aria-hidden="true"></div>
      <div class="wrap">
        <div class="section-head reveal">
          <span class="sec-idx"></span>
          <h2 data-bind="sections.contact.title"></h2>
          <span class="eyebrow sec-sub" data-bind="sections.contact.subtitle" data-hide-empty></span>
        </div>
        <div class="contact-grid">
          <div class="reveal">
            <p class="contact-big" id="contact-big"></p>
            <div class="mail-row">
              <a id="email-link" class="mail" href="#" data-magnetic="0.15"></a>
              <button id="copy-btn" class="copy glass" type="button"></button>
            </div>
            <div id="contact-socials" class="socials"></div>
          </div>
          <form id="form" class="form glass reveal" method="POST" style="--d:120ms">
            <div class="field"><input id="name" name="name" type="text" placeholder=" " autocomplete="name" required><label for="name" data-bind="contact.labels.name"></label></div>
            <div class="field"><input id="email" name="email" type="email" placeholder=" " autocomplete="email" required><label for="email" data-bind="contact.labels.email"></label></div>
            <div class="field"><textarea id="message" name="message" placeholder=" " required></textarea><label for="message" data-bind="contact.labels.message"></label></div>
            <button type="submit" class="btn" id="send-btn" data-magnetic>
              <span id="send-label" data-bind="contact.labels.button"></span>
              <svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
            </button>
            <p class="status" id="status" role="status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="t-dark" data-theme="dark">
    <div class="wrap">
      <div class="foot-row">
        <span id="footer-copy"></span>
        <div class="socials" id="socials"></div>
        <button class="to-top" id="to-top" type="button">Back to top <span aria-hidden="true">↑</span></button>
      </div>
    </div>
  </footer>

  <!-- Video viewer -->
  <div class="modal t-dark" id="modal" role="dialog" aria-modal="true" aria-label="Video" data-lenis-prevent>
    <div class="modal-top">
      <button class="modal-size" id="modal-size" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g class="i-out"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></g><g class="i-in"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></g></svg>
        <span id="modal-size-label">Expand video</span>
      </button>
      <button class="modal-close" id="modal-close" type="button">Close <span aria-hidden="true">✕</span></button>
    </div>
    <div class="modal-inner" id="modal-inner"></div>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
